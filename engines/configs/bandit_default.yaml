# SCIP default Bandit configuration
# Focuses on actionable security vulnerabilities (injections, weak crypto, deserialization).
# Excludes pure informational noise, import statements, and code hygiene linting.

skips:
  - B101  # assert_used (defensive programming / testing)
  - B110  # try_except_pass (code style / linting, not an exploitable vulnerability)
  - B112  # try_except_continue (code style)
  # Blacklist imports (flagging 'import subprocess' or 'import pickle' without usage is alert fatigue)
  - B401  # import_telnet
  - B402  # import_ftplib
  - B403  # import_pickle (actual unsafe pickle usage is caught by B301)
  - B404  # import_subprocess (actual shell injection is caught by B602)
  - B405  # import_xml_etree (actual XML vulnerabilities are caught by B313-B320)
  - B406  # import_xml_sax
  - B407  # import_xml_expat
  - B408  # import_xml_minidom
  - B409  # import_xml_pulldom
  - B410  # import_lxml
  - B411  # import_xmlrpc
  - B412  # import_httpoxy
  - B413  # import_pycrypto
  - B603  # subprocess_without_shell_equals_true (informational check on non-shell subprocess calls)

# Exclude virtual environments and build directories
# Note: Bandit performs substring checks against relative file paths.
# Anchoring with trailing slashes prevents inadvertent prefix/suffix matches (e.g. .git/ vs .github/).
exclude_dirs:
  - ".git/"
  - ".git\\"
  - ".venv/"
  - ".venv\\"
  - "venv/"
  - "venv\\"
  - ".tox/"
  - ".tox\\"
  - "node_modules/"
  - "node_modules\\"
