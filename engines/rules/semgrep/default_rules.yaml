rules:
  - id: scip.python.yaml.unsafe-load
    patterns:
      - pattern-either:
          - pattern: yaml.load($DATA, Loader=yaml.Loader)
          - pattern: yaml.load($DATA, Loader=yaml.CLoader)
          - pattern: yaml.load($DATA, Loader=yaml.UnsafeLoader)
          - pattern: yaml.load($DATA, Loader=yaml.FullLoader)
          - pattern: yaml.load($DATA, yaml.Loader)
          - pattern: yaml.load($DATA, yaml.CLoader)
          - pattern: yaml.load($DATA, yaml.UnsafeLoader)
          - pattern: yaml.load($DATA, yaml.FullLoader)
          - pattern: yaml.load($DATA)
    message: "Use of unsafe yaml.load() allows arbitrary object deserialization and code execution. Use yaml.safe_load() instead."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      confidence: HIGH
      fix: "yaml.safe_load($DATA)"

  - id: scip.python.code-execution.eval-exec
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)
    message: "Dynamic code execution via eval() or exec() can lead to arbitrary code execution if user input is evaluated."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH

  - id: scip.python.sql.formatted-query
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute(f"...", ...)
          - pattern: $CURSOR.execute("..." % (...), ...)
          - pattern: $CURSOR.execute("..." % $VAR, ...)
          - pattern: $CURSOR.execute("...".format(...), ...)
          - pattern: $CURSOR.execute($QUERY + $VAR, ...)
          - pattern: $CURSOR.execute("..." + $VAR, ...)
          - pattern: $CURSOR.raw(f"...", ...)
          - pattern: $CURSOR.raw("..." % (...), ...)
          - pattern: $CURSOR.raw("..." % $VAR, ...)
          - pattern: $CURSOR.raw("...".format(...), ...)
          - pattern: $CURSOR.raw($QUERY + $VAR, ...)
          - pattern: $CURSOR.raw("..." + $VAR, ...)
    message: "SQL query constructed with string formatting or f-strings. Use parameterized queries to prevent SQL injection."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH

  - id: scip.python.command-injection.subprocess-shell
    patterns:
      - pattern-either:
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
      - pattern-not: subprocess.$METHOD("...", ..., shell=True, ...)
    message: "Invoking subprocess with shell=True and dynamic arguments can lead to command injection."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH

  - id: scip.python.crypto.weak-hash
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
    message: "Use of weak hashing algorithm (MD5 or SHA1). Use SHA-256 or SHA-3 for security contexts."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: HIGH

  - id: scip.python.network.unverified-ssl
    patterns:
      - pattern-either:
          - pattern: requests.$METHOD(..., verify=False, ...)
          - pattern: httpx.$METHOD(..., verify=False, ...)
    message: "TLS/SSL certificate verification is explicitly disabled (verify=False), exposing connections to MITM attacks."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH

  - id: scip.python.tempfile.insecure-mktemp
    pattern: tempfile.mktemp(...)
    message: "tempfile.mktemp() is deprecated and vulnerable to race conditions. Use tempfile.NamedTemporaryFile() or mkstemp() instead."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-377: Insecure Temporary File"]
      confidence: HIGH
