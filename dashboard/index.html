html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 70% 8%,#15122a,#05060a 62%);color:var(--t);font:400 15px/1.55 Jost,system-ui,sans-serif;min-height:100vh}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:center;padding:14px}
nav{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;padding:6px;border:1px solid var(--l);border-radius:999px;background:rgba(8,9,14,.72);backdrop-filter:blur(12px)}
nav a{color:var(--m);text-decoration:none;padding:7px 15px;border-radius:999px;font-size:14px;cursor:pointer}
nav a.on,nav a:hover{color:var(--t);background:rgba(255,255,255,.08)}
nav b{align-self:center;padding:0 12px 0 10px;font-weight:500;letter-spacing:.16em}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:12px 20px 80px}
h1,h2,h3{font-weight:300;margin:0}
.hero{min-height:72vh;display:flex;flex-direction:column;justify-content:center;position:relative}
.hero h1{font-size:clamp(46px,10vw,118px);font-weight:200;line-height:.95;letter-spacing:-.02em}
.hero em{font-style:normal;margin-left:.7em;opacity:.9}
.sub{max-width:470px;color:var(--m);margin:22px 0}
.fl{position:absolute;font-size:12px;color:var(--m)}.fl b{display:block;font-size:32px;font-weight:300;color:var(--t)}
.btn{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:10px 24px;color:var(--t);text-decoration:none;background:rgba(255,255,255,.04);cursor:pointer;font:inherit}
.btn.o{border-color:var(--o);color:var(--o)}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.c{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px;backdrop-filter:blur(10px)}
.k{color:var(--m);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.n{font-size:40px;font-weight:200;line-height:1.15}
.chip{display:inline-block;padding:2px 10px;border:1px solid var(--l);border-radius:999px;font-size:12px;color:var(--m);margin:0 4px 4px 0}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.w{color:var(--w);border-color:var(--w)}.chip.e{color:var(--e);border-color:var(--e)}
table{width:100%;border-collapse:collapse}th{color:var(--m);font-weight:400;font-size:12px;text-align:left;letter-spacing:.06em;text-transform:uppercase}
td,th{padding:9px 8px;border-bottom:1px solid var(--l);vertical-align:top}tr.r{cursor:pointer}tr.r:hover{background:rgba(255,255,255,.05)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;min-width:70px;margin:6px 0 3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--o))}
.sec{margin:46px 0 14px;font-size:24px}
input,select{background:rgba(255,255,255,.05);border:1px solid var(--l);color:var(--t);border-radius:999px;padding:8px 14px;font:inherit}
pre{background:rgba(0,0,0,.42);border:1px solid var(--l);border-radius:12px;padding:14px;overflow-x:auto;font:12.5px/1.6 ui-monospace,Consolas,monospace;margin:0;white-space:pre-wrap}
.add{color:var(--ok)}.del{color:var(--e)}.wrap{overflow-x:auto}
.step{border-left:1px solid var(--o);padding:2px 0 10px 14px;margin-left:6px}
.row{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;margin:8px 0}
@media(max-width:700px){.fl{display:none}.row{grid-template-columns:90px 1fr 50px}}
